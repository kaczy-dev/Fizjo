<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#tealGrad)" />

  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-width="4" />

  <!-- Stylized cervical spine and posture alignment symbol -->
  <g filter="url(#glow)">
    <!-- Vertebra C1/C2 (Atlas/Axis) -->
    <ellipse cx="256" cy="116" rx="42" ry="24" fill="url(#spineGrad)" />
    <!-- Vertebra C3 -->
    <rect x="206" y="156" width="100" height="28" rx="14" fill="url(#spineGrad)" />
    <!-- Vertebra C4 -->
    <rect x="198" y="198" width="116" height="30" rx="15" fill="url(#spineGrad)" />
    <!-- Vertebra C5 -->
    <rect x="192" y="242" width="128" height="32" rx="16" fill="url(#spineGrad)" />
    <!-- Vertebra C6 -->
    <rect x="186" y="288" width="140" height="34" rx="17" fill="url(#spineGrad)" />
    <!-- Vertebra C7 -->
    <rect x="180" y="336" width="152" height="36" rx="18" fill="url(#spineGrad)" />
    <!-- Thoracic base T1 -->
    <rect x="172" y="386" width="168" height="38" rx="19" fill="url(#spineGrad)" />

    <!-- Center vertical spinal cord / posture plumb line -->
    <line x1="256" y1="90" x2="256" y2="436" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 10" />

    <!-- Medical cross badge in top-right -->
    <circle cx="376" cy="136" r="32" fill="#042f2e" />
    <path d="M376 118 V154 M358 136 H394" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
